<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Full TV Streams - Samsung Smart TV</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #07080c; color: white;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .logo-box {
      width: 100px; height: 100px; border-radius: 24px;
      background: #0e1117; border: 3px solid #10b981;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.35);
    }
    .play-icon {
      width: 0; height: 0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 36px solid #10b981;
      margin-left: 6px;
    }
    h1 {
      font-size: 32px; font-weight: 800; letter-spacing: 1px;
      margin: 0 0 8px 0; color: #ffffff;
    }
    h1 span { color: #10b981; }
    p {
      color: #94a3b8; font-size: 16px; margin: 0 0 24px 0;
    }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #10b981;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .url-input-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      background: #0e1117;
      padding: 20px 30px;
      border-radius: 16px;
      border: 1px solid #1f293d;
    }
    input {
      background: #161b26; border: 1px solid #334155;
      color: white; padding: 12px 18px; border-radius: 8px;
      font-size: 16px; width: 360px; text-align: center;
      outline: none;
    }
    input:focus { border-color: #10b981; }
    button {
      background: #10b981; color: black; border: none;
      padding: 12px 28px; border-radius: 8px; font-size: 16px;
      font-weight: bold; cursor: pointer;
    }
    button:hover { background: #059669; }
    .status-text {
      font-size: 13px; color: #64748b; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <div class="play-icon"></div>
  </div>
  <h1>FULL <span>TV</span> STREAMS</h1>
  <p id="msg">Iniciando aplicativo na Smart TV...</p>
  <div class="spinner" id="spinner"></div>

  <div class="url-input-box" id="urlBox">
    <p style="margin: 0; font-size: 14px; color: #cbd5e1;">Configure o link da sua Vercel:</p>
    <input type="text" id="targetUrlInput" value="https://full-tv-streams.vercel.app" />
    <button onclick="saveAndGo()">Acessar Aplicativo</button>
  </div>

  <div class="status-text" id="statusInfo">Pressione OK no controle para alterar o endereço</div>

  <script>
    // Registro de teclas de controle remoto Tizen
    try {
      if (window.tizen && tizen.tvinputdevice) {
        var keys = ['Return', 'MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop', 'MediaFastForward', 'MediaRewind'];
        for (var i = 0; i < keys.length; i++) {
          try { tizen.tvinputdevice.registerKey(keys[i]); } catch(e){}
        }
      }
    } catch(err) {}

    // Tecla Voltar / Return
    window.addEventListener('tizenhwkey', function(e) {
      if (e.keyName === 'back') {
        try { tizen.application.getCurrentApplication().exit(); } catch(err){}
      }
    });

    var DEFAULT_URL = 'https://full-tv-streams.vercel.app';
    var savedUrl = localStorage.getItem('fulltv_app_url') || DEFAULT_URL;
    document.getElementById('targetUrlInput').value = savedUrl;

    var redirected = false;

    function saveAndGo() {
      var val = document.getElementById('targetUrlInput').value.trim();
      if (!val) val = DEFAULT_URL;
      if (val.indexOf('http') !== 0) val = 'https://' + val;
      localStorage.setItem('fulltv_app_url', val);
      document.getElementById('msg').innerText = 'Conectando a ' + val + '...';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('urlBox').style.display = 'none';
      window.location.replace(val);
    }

    // Tentar redirecionar automaticamente após 1.5s
    setTimeout(function() {
      if (!redirected) {
        document.getElementById('msg').innerText = 'Carregando Full TV...';
        window.location.replace(savedUrl);
      }
    }, 1500);

    // Se após 6 segundos ainda estiver nesta tela, exibe campo para o usuário editar com o controle
    setTimeout(function() {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('urlBox').style.display = 'flex';
      document.getElementById('msg').innerText = 'Personalizar Endereço da Aplicação';
    }, 6000);

    // Enter no controle remoto abre as opções
    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 13 || e.key === 'Enter') {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('urlBox').style.display = 'flex';
      }
    });
  </script>
</body>
</html>
